name: CI/CD Pipeline - Lab 4

on:
  push:
    branches: [ main ]

env:
  REGION: us-east4
  REPOSITORY_NAME: my-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest test/test_pytest.py -v

    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Train and save model
      env:
        GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        VERSION_FILE_NAME: ${{ secrets.VERSION_FILE_NAME }}
      run: python src/train_and_save_model.py

    - name: Get model version
      env:
        GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        VERSION_FILE_NAME: ${{ secrets.VERSION_FILE_NAME }}
      run: |
        VERSION=$(python -c "
        from google.cloud import storage
        import os
        c = storage.Client()
        b = c.bucket(os.environ['GCS_BUCKET_NAME'])
        blob = b.blob(os.environ['VERSION_FILE_NAME'])
        print(blob.download_as_text() if blob.exists() else '1')
        ")
        echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build Docker image
      env:
        IMAGE_NAME: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/model-image
      run: |
        docker build -t ${IMAGE_NAME}:${{ env.MODEL_VERSION }} .

    - name: Verify Docker image
      env:
        IMAGE_NAME: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/model-image
      run: |
        echo "Verifying Python environment inside the container..."
        docker run --rm ${IMAGE_NAME}:${{ env.MODEL_VERSION }} python --version
        docker run --rm ${IMAGE_NAME}:${{ env.MODEL_VERSION }} python -c "
        import sklearn, joblib, pandas, google.cloud.storage
        from sklearn.ensemble import GradientBoostingClassifier
        print('scikit-learn:', sklearn.__version__)
        print('joblib:', joblib.__version__)
        print('pandas:', pandas.__version__)
        print('All dependencies verified inside container.')
        "

    - name: Push Docker image to Artifact Registry
      env:
        IMAGE_NAME: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/model-image
      run: |
        docker push ${IMAGE_NAME}:${{ env.MODEL_VERSION }}
        docker tag ${IMAGE_NAME}:${{ env.MODEL_VERSION }} ${IMAGE_NAME}:latest
        docker push ${IMAGE_NAME}:latest
